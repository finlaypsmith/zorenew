name: Zampto Renew head

on:
  workflow_dispatch:
  schedule:
    - cron: '6 2 * * *'

jobs:
  add_time:
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout private source files
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.UP_REPO }}
          token: ${{ secrets.UP_PAT }}

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          wget -O google-chrome-stable_current_amd64.deb https://mirror-us-stl1.armbian.airframes.io/apt/pool/bookworm-desktop/g/google-chrome-stable/google-chrome-stable_144.0.7559.59-1_amd64.deb
          sudo apt-get install -y --allow-downgrades ./google-chrome-stable_current_amd64.deb
          sudo apt-get install -y language-pack-zh-hans fonts-wqy-zenhei fonts-wqy-microhei
          echo "Checking Chrome installation..."
          which google-chrome
          google-chrome --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requirements
        run: |
          pip install -r requirements.txt

      - name: Export all secrets to env vars
        uses: oNaiPs/secrets-to-env-action@v1
        with:
          secrets: ${{ toJSON(secrets) }}

      - name: ⚙ 设置代理 (自动选择 sing-box / Xray)
        continue-on-error: false
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://gist.githubusercontent.com/janver/c5dcc485bb25a43568cb33ac3cb49efd/raw/setup_p.sh)

      - name: Start X Virtual Frame Buffer (Xvfb)
        run: Xvfb :1 -ac &

      - name: Run Time Adder Script
        env:
          CHROME_PROXY: ${{ env.PROXY_SERVER }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tmp"
          export TMPDIR="$GITHUB_WORKSPACE/.tmp"
          echo "Using TMPDIR=$TMPDIR"
          export DISPLAY=:1
          echo "Using DISPLAY=$DISPLAY"
          python zampto_server.py -r 2

      # - name: Upload error artifacts
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: screenshots
      #     path: screenshots

      - name: Cleanup proxy
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f 'xray run' || true
          rm -f sing-box sing-box-config.json sing-box.log
          rm -f xray xray-config.json xray.log

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
